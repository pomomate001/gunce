# Tuned for a 6 GB RAM machine: one 1.5 GB daemon, Kotlin compiled in-process, one worker.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# AdMob APP id (not an ad unit id). Google's sample id until the app is linked in AdMob;
# replace with your own "ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY" before the production release.
admobAppId=ca-app-pub-3940256099942544~3347511713
