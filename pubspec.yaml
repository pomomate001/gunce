name: gunce
description: "Günce - kişisel günlük, ruh hali ve anı defteri."
publish_to: 'none'

# versionName+versionCode. Increase the number after + for every Play Store upload.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+2
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  image_picker: ^1.2.4
  record: ^7.1.2
  just_audio: ^0.10.6
  google_mobile_ads: ^9.1.0
  purchases_flutter: ^10.17.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  local_auth: ^3.0.2
  crypto: ^3.0.7
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  archive: ^4.5.2
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/moods/mochi/
    - assets/moods/bear/
    - assets/moods/bunny/
    - assets/moods/pup/
    - assets/moods/fluent/
    - assets/stickers/
    - assets/licenses/

  fonts:
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/PhosphorRegular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/PhosphorFill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/PhosphorBold.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-500.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
        - asset: assets/fonts/FrauncesItalic-400.ttf
          weight: 400
          style: italic
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-VF.ttf
        - asset: assets/fonts/Lora-VF.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-400.ttf
        - asset: assets/fonts/Caveat-700.ttf
          weight: 700
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-VF.ttf
        - asset: assets/fonts/Quicksand-VF.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VF.ttf
        - asset: assets/fonts/PlayfairDisplay-VF.ttf
          weight: 700
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript-VF.ttf
        - asset: assets/fonts/DancingScript-VF.ttf
          weight: 700
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa-VF.ttf
        - asset: assets/fonts/Comfortaa-VF.ttf
          weight: 700
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-400.ttf
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-400.ttf
        - asset: assets/fonts/Kalam-700.ttf
          weight: 700
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-400.ttf
        - asset: assets/fonts/CourierPrime-700.ttf
          weight: 700
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-400.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-400.ttf
        - asset: assets/fonts/SpaceMono-700.ttf
          weight: 700
